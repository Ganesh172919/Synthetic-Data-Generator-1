name: Server CI

on:
  push:
    paths:
      - "website/server/**"
      - ".github/workflows/server.yml"
  pull_request:
    paths:
      - "website/server/**"
      - ".github/workflows/server.yml"

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website/server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: website/server/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Run tests
        run: npm test
